name: Compilar APK y programa de Windows

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    name: App de las TVs (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk BucleTV.apk

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: BucleTV-apk
          path: BucleTV.apk

  windows:
    name: Programa del estudio (Windows)
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crear el .exe
        working-directory: servidor
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name "BucleTV-Estudio" --add-data "panel.html;." bucletv_estudio.py

      - name: Guardar el programa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: BucleTV-Estudio-Windows
          path: servidor/dist/BucleTV-Estudio.exe
